name: Build and release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare official build references
        run: bash scripts/prepare-references.sh
      - name: Build
        run: dotnet build src/Jellyfin.Plugin.FnosSync/Jellyfin.Plugin.FnosSync.csproj -c Release
      - name: Package
        run: python scripts/package.py
      - name: Verify installation package
        run: python scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-fnos-sync
          path: artifacts/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
          fi
